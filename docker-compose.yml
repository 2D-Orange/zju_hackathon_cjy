version: "3.9"

services:
  backend:
    image: python:3.12-slim
    container_name: hackathon-backend
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt &&
             python src/backend/run.py"
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATA_DIR=./data
      - UPLOAD_DIR=data/uploads
      - INTEGRATION_STORE_PATH=data/processed/integration_decisions.json
      - CHAT_STORE_PATH=data/processed/chat_sessions.json
      - CORS_ALLOW_ORIGINS=*
    volumes:
      - .:/app
      - backend_data:/app/data

  frontend:
    image: node:22-alpine
    container_name: hackathon-frontend
    working_dir: /app
    command: >
      sh -c "cd src/frontend && npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_DEV_API_TARGET=http://backend:8000
    volumes:
      - .:/app
    depends_on:
      - backend

volumes:
  backend_data:
