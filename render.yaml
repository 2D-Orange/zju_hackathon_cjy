services:
  - type: web
    name: zju-hackathon-cjy-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python src/backend/run.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: ./data
      - key: UPLOAD_DIR
        value: data/uploads
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: EMBEDDING_MODEL
        sync: false

  - type: web
    name: zju-hackathon-cjy-web
    runtime: static
    buildCommand: cd src/frontend && npm ci && npm run build
    staticPublishPath: src/frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://zju-hackathon-cjy-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
